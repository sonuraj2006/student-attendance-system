<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - CampusPulse Attendance System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="brand-badge mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.6rem;">
        <i class="bi bi-mortarboard-fill"></i>
      </div>
      <h2 class="fw-bold mb-1" style="letter-spacing: -0.03em;">Welcome Back</h2>
      <p class="text-muted small mb-0">Student Attendance & Parent Notification Portal</p>
    </div>

    <!-- Alert placeholder -->
    <div id="loginAlert" class="alert alert-danger d-none py-2 px-3 small" role="alert"></div>

    <form id="loginForm">
      <div class="mb-3">
        <label for="email" class="form-label small fw-semibold text-muted text-uppercase">Email Address</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
          <input type="email" class="form-control border-start-0" id="email" placeholder="name@college.edu" required autofocus>
        </div>
      </div>

      <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center mb-1">
          <label for="password" class="form-label small fw-semibold text-muted text-uppercase mb-0">Password</label>
        </div>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
          <input type="password" class="form-control border-start-0" id="password" placeholder="Enter your password" required>
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary-custom w-100 justify-content-center py-2 mb-3">
        <i class="bi bi-box-arrow-in-right"></i> Sign In to Portal
      </button>
    </form>

    <!-- Quick-fill demo credentials for lab evaluation -->
    <div class="mt-4 pt-3 border-top text-center">
      <p class="text-muted small fw-semibold mb-2">Quick Demo Accounts (Evaluation):</p>
      <div class="d-flex justify-content-center gap-2 flex-wrap">
        <button type="button" class="demo-chip" onclick="fillDemo('faculty@college.edu', 'Faculty@123456')">
          <i class="bi bi-person-badge"></i> Faculty Account
        </button>
        <button type="button" class="demo-chip" onclick="fillDemo('admin@college.edu', 'Admin@123456')">
          <i class="bi bi-shield-lock"></i> Admin Account
        </button>
      </div>
    </div>
  </div>

  <div id="toastContainer"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
  <script>
    function fillDemo(email, pass) {
      document.getElementById("email").value = email;
      document.getElementById("password").value = pass;
      App.showToast(`Selected demo credentials for ${email}`, "info");
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const alertBox = document.getElementById("loginAlert");
      const submitBtn = document.getElementById("submitBtn");
      alertBox.classList.add("d-none");

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Authenticating...';

      try {
        const response = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || "Login failed. Please check credentials.");
        }

        App.setAuth(data.token, data.user);
        App.showToast("Login successful! Redirecting...", "success");
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 500);
      } catch (err) {
        alertBox.textContent = err.message;
        alertBox.classList.remove("d-none");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right"></i> Sign In to Portal';
      }
    });
  </script>
</body>
</html>
