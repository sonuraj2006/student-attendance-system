<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Attendance and Parent Notification System</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js"></script>
</head>
<body>
  <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1rem;">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
    <p style="font-weight: 600; color: var(--text-muted);">Loading CampusPulse Attendance System...</p>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const token = App.getToken();
      if (token) {
        window.location.replace("dashboard.html");
      } else {
        window.location.replace("login.html");
      }
    });
  </script>
</body>
</html>
